# DeepSpaceTelemetry configuration ("complex disruption & bursty loss scenario").

[simulation]
speed_up = 3600.0                    # Wall-clock to mission-time acceleration factor. SAFE: > 0.
start_sim_time = "2035-01-01T06:00:00" # Mission epoch. SAFE: ISO-8601 datetime.
test_duration_sec = 168.0            # Wall-clock simulation span [s]. SAFE: > 0.
initial_downtime_days = 2.0          # Pre-populated blind-spot backlog [days]. SAFE: >= 0.
rng_seed = 2035                      # Seeds physics and packet-loss RNGs. SAFE: integer.

[storage]
max_storage_gb = 5.0                 # Run-directory disk budget [GB]. SAFE: > 0.
max_file_count = 500000              # Run-directory inode budget. SAFE: > 0.

[supervision]
on_component_failure = "abort"       # Policy on a component failure. One of: "abort" | "continue" | "restart".
max_restarts = 3                     # Relaunch budget per component when policy = "restart". SAFE: >= 0.
watchdog_sec = 30.0                  # Heartbeat-silence threshold flagging a hung component [s]. SAFE: > 0.

[retention]
enabled = false                      # Delivered payload pruning flag. One of: true | false.
grace_hours = 24.0                   # Minimum payload retention window [h]. SAFE: > 0.
high_watermark_gb = 1.5              # Prunable payload size threshold [GB]. SAFE: (0, max_storage_gb].
log_rotate_mb = 64.0                 # Log file rotation limit [MB]. SAFE: > 0.

[telemetry]
session_start = "08:00:00"           # Daily DSN window start time. SAFE: HH:MM:SS format.
session_duration_hours = 8.0         # Daily DSN window duration [h]. SAFE: (0, 24].
max_batches_per_hour = 60.0          # Peak DSN transmission capacity [batches/h]. SAFE: > 0.
bandwidth_profile = "gaussian"       # Downlink profile. One of: "sine" | "sigmoid" | "gaussian" | "flat".
max_inflight_batches = 5             # Concurrent batches allowed on the downlink. SAFE: >= 1.
min_link_factor = 0.05               # Capacity floor below which no transfer is attempted. SAFE: [0, 1).
sigmoid_steepness = 10.0             # Sigmoid profile edge steepness. SAFE: > 0.
gaussian_sigma = 0.15                # Gaussian profile standard deviation. SAFE: > 0.

[physics]
data_source = "synthetic"            # Data stream mode. One of: "synthetic" | "external".
external_data_path = "data/example_external_strain.csv" # File path when data_source = "external".
sample_rate = 4.0                    # Strain sampling frequency [Hz]. SAFE: > 0.
segment_duration_sec = 60.0          # Segment duration [s]. SAFE: > 0.
batch_size = 10                      # Segments per telemetry batch. SAFE: >= 1.
signal_injection_probability = 0.02  # Per-segment synthetic signal-flag probability. SAFE: [0, 1].

[packet_loss]
enabled = true                       # Packet loss toggle. One of: true | false.
model = "gilbert_elliott"            # Loss model. One of: "bernoulli" | "gilbert_elliott".
p_good_to_bad = 0.03                 # Good-to-bad state transition probability. SAFE: [0, 1].
p_bad_to_good = 0.25                 # Bad-to-good state transition probability. SAFE: [0, 1].
p_loss_good = 0.01                   # Loss probability in good state. SAFE: [0, 1].
p_loss_bad = 0.50                    # Loss probability in bad state. SAFE: [0, 1].
p_loss = 0.10                        # Loss probability when model = "bernoulli". SAFE: [0, 1].
on_loss = "retransmit"               # Action on loss. One of: "retransmit" | "drop".
max_retries = 3                      # Retry limit before moving batch to lost/. SAFE: >= 0.

[[disruption.events]]
type = "solar_flare"                 # Event type identifier.
label = "solar flare"                # Display label for logs and viewer.
start_day = 2.5                      # Event onset time [mission days]. SAFE: >= 0.
duration_hours = 18.0                # Duration of full blackout phase [h]. SAFE: > 0.
severity = 1.0                       # Link capacity reduction factor. SAFE: [0, 1].
recovery_hours = 12.0                # Duration of linear recovery ramp [h]. SAFE: >= 0.
loss_multiplier = 5.0                # Loss probability multiplier during event. SAFE: >= 1.0.

[[disruption.events]]
type = "dsn_outage"                  # Event type identifier.
label = "dsn outage"                 # Display label for logs and viewer.
start_day = 5.0                      # Event onset time [mission days]. SAFE: >= 0.
duration_hours = 12.0                # Duration of partial blackout phase [h]. SAFE: > 0.
severity = 0.8                       # Link capacity reduction factor. SAFE: [0, 1].
recovery_hours = 6.0                 # Duration of linear recovery ramp [h]. SAFE: >= 0.
loss_multiplier = 3.0                # Loss probability multiplier during event. SAFE: >= 1.0.

[dashboard]
open_live_viewer = false             # Live viewer terminal flag. One of: true | false.
open_receiver_log = false            # Receiver log terminal flag. One of: true | false.
open_emitter_log = false             # Emitter log terminal flag. One of: true | false.

[post_processing]
generate_batch_matrix = true         # 2D telemetry mask timeline flag. One of: true | false.
expand_to_pointwise_masks = true     # Point-wise mask expansion flag. One of: true | false.
target_event_rows = [-1]             # Target rows for mask expansion. SAFE: "all", ints, or range strings.
