# Provenance of the figures shown in README.md and in the manual. Both derive
# from one run of the shipped scenario; regenerate them with the commands
# below. The realized totals depend on how much mission time the host
# completes within the configured wall-clock budget, so a re-run on another
# machine reproduces the regime and the figures, not the counts to the batch;
# the platform the recorded run used is stated below.

[render]
# The run was made with this release; the figures were rendered from it with
# the plotting code of the commit below (release 2.0.1), which reads the run
# directory through the same file contract. Nothing in the run was altered.
commit = "063f4a4"
package_version = "2.0.1"
date = "2026-09-30"
mission_summary = "julia -e 'include(\"activate.jl\"); using DeepSpaceTelemetry; DeepSpaceTelemetry.MissionFigures.generate_mission_plots(DeepSpaceTelemetry.TelemetryCore.run_directory(\"RUN_README_SHOWCASE\"))'"
animation = "julia scripts/postprocessing/generate_gif.jl --web RUN_README_SHOWCASE"

[run]
scenario = "scenarios/stress_8h_bursty.toml"
run_id = "RUN_README_SHOWCASE"
commit = "501a21759dbd126dba9d16ddf121732cf2d22840"
package_version = "1.2.1"
julia_version = "1.13.0"
date = "2026-09-30"
command = "julia --threads=3 scripts/run_full_sim.jl RUN_README_SHOWCASE scenarios/stress_8h_bursty.toml"

[run.platform]
hostname = "Lenovo-Yoga-Pro-7"
os = "Linux x86_64-linux-gnu"
cpu_model = "Intel(R) Core(TM) Ultra 7 155H"
logical_cores = 22
total_memory_gb = 30.76
julia_threads = 3
blas_threads = 6

[run.realized]
# Final row of mission_profile.csv.
ground_total = 707
ground_live = 329
ground_archive = 378
failed_transfers = 46
lost = 0
onboard_buffer_start = 288
onboard_buffer_end = 582
profile_rows = 1298

["mission_summary.png"]
source = "data/runs/RUN_README_SHOWCASE/plots/mission_summary_global.png"
transform = "magick <source> -resize 1400x -strip <target>"
width_px = 1400
sha256_prefix = "e3bc32f6ea21fe93"

["batch_routing.gif"]
source = "data/runs/RUN_README_SHOWCASE/plots/telemetry_animation_web.gif"
transform = "none; the --web rendering profile writes the published size directly"
width_px = 900
frames = 217
sha256_prefix = "d8b82531c9ce5f35"
