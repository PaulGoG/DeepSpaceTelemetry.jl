# Coverage of the two packages (src/ and reader/src/); the scripts, the
# benchmarks and the documentation build are outside the measurement.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        target: 80%
        threshold: 5%
        informational: true
comment:
  layout: "reach, diff, flags, files"
  require_changes: true
ignore:
  - "scripts/"
  - "bench/"
  - "docs/"
