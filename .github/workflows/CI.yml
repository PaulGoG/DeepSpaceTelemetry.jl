name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: Tests — Julia ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Every leg blocks the workflow except "pre", which watches the next
    # prerelease and may fail without failing the workflow: Linux on the
    # current stable release and on "1.12" (the compat floor), macOS and
    # Windows on the current stable release. Coverage runs once: it disables
    # package images and roughly doubles the precompile time.
    #
    # The committed manifests are resolved on the development version (the
    # current stable release) and pin its standard-library membership, which
    # moves between Julia versions: Zstd_jll, for one, is a standard library
    # on 1.13 and a registered package on 1.12, so a 1.13 manifest cannot be
    # built on the floor. Legs on any other version therefore resolve their
    # own environment, which is what the `julia` compat bound claims anyway;
    # the blocking Linux "1" leg is the one that validates the manifests as
    # committed.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1"
            os: ubuntu-latest
            coverage: true
            experimental: false
            resolve: false
          - version: "1.12"
            os: ubuntu-latest
            coverage: false
            experimental: false
            resolve: true
          - version: "pre"
            os: ubuntu-latest
            coverage: false
            experimental: true
            resolve: true
          - version: "1"
            os: macos-latest
            coverage: false
            experimental: false
            resolve: false
          - version: "1"
            os: windows-latest
            coverage: false
            experimental: false
            resolve: false
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Resolve a fresh environment for this Julia version
        if: matrix.resolve
        shell: bash
        run: rm -f Manifest.toml test/Manifest.toml
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - run: |
          julia -e 'using Pkg; Pkg.add("JuliaFormatter"); using JuliaFormatter;
                    format(".", verbose = false) || error("Formatting check failed: run JuliaFormatter over the repository.")'
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # deploydocs pushes docs/build to gh-pages with the workflow token.
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - run: julia docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
