name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
# Superseded pull-request runs are cancelled. Runs on main and on tags finish:
# a run cancelled while it instantiates leaves a partial depot in the cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    name: Tests — Julia ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Every leg blocks the workflow except "pre", which watches the next
    # prerelease and may fail without failing the workflow: Linux on the
    # current stable release and on "1.12" (the compat floor), macOS and
    # Windows on the current stable release. Coverage runs once: it disables
    # package images and roughly doubles the precompile time. No manifest is
    # tracked, so every leg resolves its environment from Project.toml and
    # [compat] on its own Julia version.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1"
            os: ubuntu-latest
            coverage: true
            experimental: false
          - version: "1.12"
            os: ubuntu-latest
            coverage: false
            experimental: false
          - version: "pre"
            os: ubuntu-latest
            coverage: false
            experimental: true
          - version: "1"
            os: macos-latest
            coverage: false
            experimental: false
          - version: "1"
            os: windows-latest
            coverage: false
            experimental: false
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # The emitter and the receiver run as concurrent tasks paced against
      # the wall clock; on a single thread one component stalls the other.
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}
        env:
          JULIA_NUM_THREADS: 3
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - run: |
          julia -e 'using Pkg; Pkg.add(name = "JuliaFormatter", version = "2"); using JuliaFormatter;
                    format(".", verbose = false) || error("Formatting check failed: run JuliaFormatter over the repository.")'
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # Pushes to main and release tags both deploy to gh-pages; one group
    # across those refs serializes them. A pull-request build deploys nothing
    # (push_preview is off) and gets a group of its own per ref: inside the
    # deploy group each newly pending build cancels the previous one.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'docs-deploy' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # deploydocs pushes docs/build to gh-pages with the workflow token.
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - run: julia docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
