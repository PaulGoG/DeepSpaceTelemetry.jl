name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
# Superseded pull-request runs are cancelled. Runs on main and on tags finish:
# a run cancelled while it instantiates leaves a partial depot in the cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    name: Tests — Julia ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # julia-actions/cache deletes superseded caches only with actions: write.
    permissions:
      contents: read
      actions: write
    # "pre" may fail without failing the workflow; every other leg blocks.
    # "min" is the [compat] floor of Project.toml, which lies above the LTS
    # series and takes its place. Coverage runs on one leg: it disables
    # package images and roughly doubles the precompile time. No manifest is
    # tracked; each leg resolves its environment on its own Julia version.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1"
            os: ubuntu-latest
            coverage: true
            experimental: false
          - version: "min"
            os: ubuntu-latest
            coverage: false
            experimental: false
          - version: "pre"
            os: ubuntu-latest
            coverage: false
            experimental: true
          - version: "1"
            os: macos-latest
            coverage: false
            experimental: false
          - version: "1"
            os: windows-latest
            coverage: false
            experimental: false
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
        with:
          directories: src,reader/src,headless/src
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  headless:
    # The headless package alone, in its own environment: the licence
    # list of its dependency closure, no figure backend, a mission.
    name: Headless package — Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        version: ["1", "min"]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - run: julia headless/test/runtests.jl
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pushes to main and release tags both deploy to gh-pages; one group
    # across those refs serializes them. A pull-request build deploys nothing
    # (push_preview is off) and gets a group of its own per ref: inside the
    # deploy group each newly pending build cancels the previous one.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'docs-deploy' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # deploydocs pushes docs/build to gh-pages with the workflow token.
    permissions:
      contents: write
      pull-requests: read
      statuses: write
      actions: write # julia-actions/cache prunes superseded caches
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - run: julia docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
