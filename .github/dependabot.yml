version: 2
updates:
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/test"
      - "/docs"
      - "/bench"
      - "/scripts"
    schedule:
      interval: "weekly"
    # One pull request per directory and week, not one per package.
    groups:
      julia:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
