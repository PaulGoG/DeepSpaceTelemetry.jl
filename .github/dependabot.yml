version: 2
updates:
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/test"
      - "/docs"
      - "/bench"
      - "/scripts"
    schedule:
      interval: "weekly"
    # One pull request per directory and week, not one per package.
    groups:
      julia:
        patterns:
          - "*"
    # CSV 1.x changes date-time and string inference; the migration is
    # scheduled for 2.1 with explicit column types.
    ignore:
      - dependency-name: "CSV"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
