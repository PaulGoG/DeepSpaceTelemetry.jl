# The registered packages of the dependency closure of the headless package
# (and of the reader), upgraded standard libraries included, each with the
# licences its licence files state ("+" joins several), read 2026-11-16.
# A dependency that enters the closure is added here after its licence is
# read; test/runtests.jl fails on one that is not listed or whose licence
# files state something else. DataStrings is Apache-2.0, with MIT-licensed
# parts taken from CSV; its NOTICE travels with a bundle.
[packages]
CSV = "MIT"
CodecZlib = "MIT"
Compat = "MIT"
Crayons = "MIT"
DataAPI = "MIT"
DataFrames = "MIT"
DataStrings = "Apache-2.0+MIT"
DataStructures = "MIT"
DataValueInterfaces = "MIT"
Durations = "MIT"
InlineStrings = "MIT"
InvertedIndices = "MIT"
IteratorInterfaceExtensions = "MIT"
JSON = "MIT"
LaTeXStrings = "MIT"
LoggingExtras = "MIT"
Missings = "MIT"
OrderedCollections = "MIT"
Parsers = "MIT"
PooledArrays = "MIT"
PrecompileTools = "MIT"
Preferences = "MIT"
PrettyTables = "MIT"
ProgressMeter = "MIT"
Reexport = "MIT"
SentinelArrays = "MIT"
SortingAlgorithms = "MIT"
Statistics = "MIT"
StringManipulation = "MIT"
StructUtils = "MIT"
TableTraits = "MIT"
Tables = "MIT"
TranscodingStreams = "MIT"
